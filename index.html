<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Temporary Page</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('background.png') no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    /* Make top.gif 50% bigger */
    .container img:first-of-type {
      width: 150%;
      height: auto;
    }

    /* Alternating text color and animated border */
    .link {
      display: inline-block;
      font-size: 3.6em; /* Increased by 50% */
      text-decoration: none;
      font-weight: bold;
      background-color: #d3d3d3; /* light gray background */
      padding: 8px 16px;
      border-radius: 8px;
      position: relative;
      animation: colorCycle 3s infinite linear;
      z-index: 0;
    }

    /* Create animated border using pseudo-element */
    .link::before {
      content: "";
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      border-radius: 10px;
      border: 3px solid transparent;
      background: linear-gradient(90deg, #00ff00, #ffff00, #00ff00);
      background-size: 200% 200%;
      animation: borderShift 2s linear infinite;
      z-index: -1;
    }

    @keyframes borderShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Updated color cycle: white → blue → black → white */
    @keyframes colorCycle {
      0% { color: white; }
      33% { color: blue; }
      66% { color: black; }
      100% { color: white; }
    }

    .link:hover {
      text-decoration: underline;
    }

    /* Arrange gif1 and gif2 horizontally */
    .gif-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .gif-row img {
      max-width: 45%;
      height: auto;
    }

    /* Delay gif2 start by 0.5 seconds */
    .gif-row img:nth-child(2) {
      animation: fadeIn 0s ease 0.5s forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="top.gif" alt="Top GIF">

    <a href="https://opensea.io/collection/tomato-aces-christmas/overview" class="link" target="_blank">
      Visit OpenSea for the NFTs
    </a>

    <div class="gif-row">
      <img src="gif1.gif" alt="Gif 1">
      <img src="gif2.gif" alt="Gif 2">
    </div>

    <img src="gif3.gif" alt="Gif 3">
  </div>
</body>
</html>
